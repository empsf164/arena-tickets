<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ARENA Sports Ticketing</title>
  <meta name="description" content="Sign in to your ARENA account to access fast-track mobile passes, manage event bookings, and receive priority ticket drop notifications.">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- PRIMARY NAVBAR -->
  <header class="arena-navbar">
    <div class="container-custom d-flex align-items-center justify-content-between">
      <a href="index.html" class="navbar-brand-arena" aria-label="ARENA Homepage">
        <div class="brand-icon"><i class="bi bi-shield-shaded"></i></div>
        <div>
          <span class="brand-text">ARENA</span>
          <span class="brand-tag">FEEL THE GAME</span>
        </div>
      </a>

      <div class="d-flex align-items-center gap-2">
        <button class="btn-theme-toggle theme-toggle-btn" aria-label="Toggle Theme"><i class="bi bi-sun-fill"></i></button>
        <a href="signup.html" class="btn btn-sm btn-outline-arena">Create Account</a>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       LOGIN AUTH SECTION
       ========================================================================= -->
  <main class="flex-grow-1 d-flex align-items-center py-5 position-relative" style="background-image: linear-gradient(180deg, rgba(5, 8, 17, 0.75) 0%, var(--bg-body) 100%), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1800&q=80'); background-size: cover; background-position: center;">
    <div class="container-custom">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5 col-xl-4">
          
          <div class="p-4 p-md-5 bg-surface-1 border border-medium rounded-3 shadow-lg position-relative z-2">
            
            <div class="text-center mb-4">
              <span class="badge-sport mb-2">Member Access</span>
              <h1 class="h3 font-heading mb-1">Sign In to ARENA</h1>
              <p class="text-secondary small mb-0">Access your match passes and priority drops.</p>
            </div>

            <!-- Social Sign In Simulation -->
            <button type="button" class="btn btn-outline-arena w-100 mb-3 py-2 d-flex align-items-center justify-content-center gap-2" onclick="window.ArenaToast ? window.ArenaToast.show('Google Sign-In simulation verified.', 'success') : alert('Signed in');">
              <svg width="18" height="18" viewBox="0 0 18 18">
                <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
              </svg>
              <span>Continue with Google</span>
            </button>

            <div class="d-flex align-items-center my-3">
              <hr class="flex-grow-1 border-subtle">
              <span class="px-2 text-muted small text-uppercase">Or with email</span>
              <hr class="flex-grow-1 border-subtle">
            </div>

            <!-- Login Form -->
            <form id="arenaLoginForm" class="d-flex flex-column gap-3">
              <div>
                <label class="search-field-label">Email Address</label>
                <input type="email" class="arena-input" id="loginEmail" placeholder="name@example.com" value="alexander.wright@example.com" required>
              </div>

              <div>
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label class="search-field-label mb-0">Password</label>
                  <a href="forgot-password.html" class="small text-muted text-decoration-none">Forgot Password?</a>
                </div>
                <div class="input-group">
                  <input type="password" class="arena-input" id="loginPassword" placeholder="••••••••" value="ArenaPass2026!" required>
                  <button type="button" class="input-group-text bg-surface-2 border-subtle text-secondary password-toggle-btn" data-target="loginPassword" aria-label="Toggle password visibility">
                    <i class="bi bi-eye-fill"></i>
                  </button>
                </div>
              </div>

              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMeCheck" checked>
                <label class="form-check-label text-secondary small" for="rememberMeCheck">
                  Remember this device for 30 days
                </label>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                Sign In <i class="bi bi-arrow-right"></i>
              </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-subtle text-secondary small">
              Don't have an ARENA account yet? 
              <a href="signup.html" class="text-primary fw-bold text-decoration-none">Create Account</a>
            </div>

          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="arena-footer mt-0 py-4 border-top border-subtle">
    <div class="container-custom text-center text-muted small">
      &copy; 2026 ARENA Ticketing Technologies Inc. | <a href="help.html" class="text-muted">Security & Privacy</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
