<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ARENA Sports Ticketing</title>
  <meta name="description"
    content="Sign in to your ARENA account to access fast-track mobile passes, manage event bookings, and receive priority ticket drop notifications.">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body class="min-vh-100 d-flex flex-column justify-content-center">

  <!-- =========================================================================
       LOGIN AUTH SECTION (Clean Fullscreen Card with Brandname Top Center)
       ========================================================================= -->
  <main class="auth-page" style="background-image: linear-gradient(180deg, rgba(5, 8, 17, 0.85) 0%, var(--bg-body) 100%), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=1800&q=80');">
    <div class="auth-card-wrapper">
      <div class="auth-card">

        <!-- Top Center Brand Logo -->
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center justify-content-center gap-2 text-decoration-none mb-3">
            <div class="brand-icon">
              <i class="bi bi-shield-shaded"></i>
            </div>
            <div class="text-start">
              <span class="brand-text d-block" style="font-family: var(--font-heading); font-size: 1.65rem; font-weight: 900; color: #FFFFFF; letter-spacing: 0.12em; line-height: 1;">ARENA</span>
              <span class="brand-tag d-block" style="font-size: 0.62rem; color: #94A3B8; letter-spacing: 0.18em; text-transform: uppercase;">FEEL THE GAME</span>
            </div>
          </a>
          <div>
            <span class="badge-sport mb-2">Member Access</span>
            <h1 class="h3 font-heading mb-1 text-white">Sign In to ARENA</h1>
            <p class="text-secondary small mb-0">Access your match passes and priority drops.</p>
          </div>
        </div>

        <!-- Login Form -->
        <form id="arenaLoginForm" class="d-flex flex-column gap-3">
          <div>
            <label class="search-field-label">Email Address</label>
            <input type="email" class="arena-input" id="loginEmail" placeholder="name@example.com"
              value="alexander.wright@example.com" required>
          </div>

          <div>
            <label class="search-field-label">Password</label>
            <div class="input-group">
              <input type="password" class="arena-input" id="loginPassword" placeholder="••••••••"
                value="ArenaPass2026!" required>
              <button type="button"
                class="input-group-text bg-surface-2 border-subtle text-secondary password-toggle-btn"
                data-target="loginPassword" aria-label="Toggle password visibility">
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password on the same line -->
          <div class="d-flex align-items-center justify-content-between my-1">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="rememberMeCheck" checked>
              <label class="form-check-label text-secondary small" for="rememberMeCheck">
                Remember me
              </label>
            </div>
            <a href="forgot-password.html" class="small text-primary text-decoration-none fw-semibold">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
            Sign In <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <!-- Social Sign In at Bottom (Google & Apple) -->
        <div class="d-flex align-items-center my-4">
          <hr class="flex-grow-1 border-subtle">
          <span class="px-3 text-muted small text-uppercase">Or connect with</span>
          <hr class="flex-grow-1 border-subtle">
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <button type="button"
              class="btn btn-outline-arena w-100 py-2 d-flex align-items-center justify-content-center gap-2"
              onclick="window.ArenaToast ? window.ArenaToast.show('Google Authentication connected.', 'success') : alert('Signed in');">
              <i class="bi bi-google fs-5" style="color: #EA4335;"></i>
              <span class="small fw-semibold">Google</span>
            </button>
          </div>
          <div class="col-6">
            <button type="button"
              class="btn btn-outline-arena w-100 py-2 d-flex align-items-center justify-content-center gap-2"
              onclick="window.ArenaToast ? window.ArenaToast.show('Apple ID Authentication connected.', 'success') : alert('Signed in');">
              <i class="bi bi-apple fs-5 text-white"></i>
              <span class="small fw-semibold">Apple</span>
            </button>
          </div>
        </div>

        <div class="text-center mt-3 pt-3 border-top border-subtle text-secondary small">
          Don't have an ARENA account yet?
          <a href="signup.html" class="text-primary fw-bold text-decoration-none">Create Account</a>
        </div>

      </div>

      <!-- Bottom Return Link -->
      <div class="text-center mt-4">
        <a href="index.html" class="text-muted small text-decoration-none">
          <i class="bi bi-arrow-left"></i> Return to ARENA Homepage
        </a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
