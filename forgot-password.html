<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | ARENA Sports Ticketing</title>
  <meta name="description" content="Reset your ARENA account password. We will send a secure password reset link to your registered email address.">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="min-vh-100 d-flex flex-column justify-content-center">

  <!-- =========================================================================
       PASSWORD RECOVERY SECTION (Clean Fullscreen Card with Brandname Top Center)
       ========================================================================= -->
  <main class="auth-page" style="background-image: linear-gradient(180deg, rgba(5, 8, 17, 0.85) 0%, var(--bg-body) 100%), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=1800&q=80');">
    <div class="auth-card-wrapper">
      <div class="auth-card">
        
        <!-- Top Center Brand Logo -->
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center justify-content-center gap-2 text-decoration-none mb-3">
            <div class="brand-icon">
              <i class="bi bi-shield-shaded"></i>
            </div>
            <div class="text-start">
              <span class="brand-text d-block" style="font-family: var(--font-heading); font-size: 1.65rem; font-weight: 900; color: #FFFFFF; letter-spacing: 0.12em; line-height: 1;">ARENA</span>
              <span class="brand-tag d-block" style="font-size: 0.62rem; color: #94A3B8; letter-spacing: 0.18em; text-transform: uppercase;">FEEL THE GAME</span>
            </div>
          </a>
          <div>
            <div class="mb-3 d-inline-flex align-items-center justify-content-center" style="width: 58px; height: 58px; border-radius: 50%; background: var(--color-primary-light); color: var(--color-primary);">
              <i class="bi bi-key-fill fs-3"></i>
            </div>
            <h1 class="h3 font-heading mb-1 text-white">Recover Password</h1>
            <p class="text-secondary small mb-0">Enter your email and we'll send a secure authorization link.</p>
          </div>
        </div>

        <!-- Recovery Form -->
        <form id="forgotPasswordForm" class="d-flex flex-column gap-3">
          <div>
            <label class="search-field-label">Account Email Address</label>
            <input type="email" class="arena-input" id="resetEmail" placeholder="name@example.com" value="alexander.wright@example.com" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
            Send Reset Link <i class="bi bi-send-fill"></i>
          </button>
        </form>

        <!-- Success State Card (Revealed via JS) -->
        <div id="resetSentCard" class="text-center py-3" style="display: none;">
          <div class="mb-3 d-inline-flex align-items-center justify-content-center" style="width: 58px; height: 58px; border-radius: 50%; background: var(--color-success-light); color: var(--color-success);">
            <i class="bi bi-envelope-check-fill fs-3"></i>
          </div>
          <h4 class="font-heading mb-2">Check Your Inbox</h4>
          <p class="text-secondary small mb-3">
            We've dispatched password recovery instructions to <strong id="sentEmailAddress" class="text-primary">alexander.wright@example.com</strong>.
          </p>
          <div class="d-flex flex-column gap-2">
            <button type="button" class="btn btn-sm btn-outline-arena" id="btnResendReset" disabled>
              Resend Link <span id="resendCountdown">(60s)</span>
            </button>
            <a href="login.html" class="btn btn-sm btn-primary mt-2">Back to Sign In</a>
          </div>
        </div>

        <div class="text-center mt-4 pt-3 border-top border-subtle text-secondary small">
          Remember your password? 
          <a href="login.html" class="text-primary fw-bold text-decoration-none">Sign In</a>
        </div>

      </div>

      <!-- Bottom Return Link -->
      <div class="text-center mt-4">
        <a href="index.html" class="text-muted small text-decoration-none">
          <i class="bi bi-arrow-left"></i> Return to ARENA Homepage
        </a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
