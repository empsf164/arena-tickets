<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | ARENA Sports Ticketing</title>
  <meta name="description" content="Register your ARENA account to book stadium seats, receive verified digital matchday passes, and access priority tournament presales.">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="min-vh-100 d-flex flex-column justify-content-center">

  <!-- =========================================================================
       SIGNUP AUTH SECTION (Clean Fullscreen Card with Brandname Top Center)
       ========================================================================= -->
  <main class="auth-page" style="background-image: linear-gradient(180deg, rgba(5, 8, 17, 0.85) 0%, var(--bg-body) 100%), url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&w=1800&q=80');">
    <div class="auth-card-wrapper signup-wrapper">
      <div class="auth-card">
        
        <!-- Top Center Brand Logo -->
        <div class="text-center mb-4">
          <a href="index.html" class="d-inline-flex align-items-center justify-content-center gap-2 text-decoration-none mb-3">
            <div class="brand-icon">
              <i class="bi bi-shield-shaded"></i>
            </div>
            <div class="text-start">
              <span class="brand-text d-block" style="font-family: var(--font-heading); font-size: 1.65rem; font-weight: 900; color: #FFFFFF; letter-spacing: 0.12em; line-height: 1;">ARENA</span>
              <span class="brand-tag d-block" style="font-size: 0.62rem; color: #94A3B8; letter-spacing: 0.18em; text-transform: uppercase;">FEEL THE GAME</span>
            </div>
          </a>
          <div>
            <span class="badge-sport mb-2">Instant Registration</span>
            <h1 class="h3 font-heading mb-1 text-white">Join ARENA</h1>
            <p class="text-secondary small mb-0">Direct access to verified international sports tickets.</p>
          </div>
        </div>

        <!-- Sign Up Form -->
        <form id="arenaSignupForm" class="d-flex flex-column gap-3">
          <div>
            <label class="search-field-label">Full Name</label>
            <input type="text" class="arena-input" id="signupFullName" placeholder="e.g. Jordan Henderson" required>
          </div>

          <div class="row g-2">
            <div class="col-md-6">
              <label class="search-field-label">Email Address</label>
              <input type="email" class="arena-input" id="signupEmail" placeholder="name@domain.com" required>
            </div>
            <div class="col-md-6">
              <label class="search-field-label">Mobile Phone</label>
              <input type="tel" class="arena-input" id="signupPhone" placeholder="+44 7911 123456" required>
            </div>
          </div>

          <div>
            <label class="search-field-label">Create Password</label>
            <div class="input-group">
              <input type="password" class="arena-input" id="signupPassword" placeholder="Minimum 8 characters" minlength="8" required>
              <button type="button" class="input-group-text bg-surface-2 border-subtle text-secondary password-toggle-btn" data-target="signupPassword" aria-label="Toggle password">
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
          </div>

          <div>
            <label class="search-field-label">Confirm Password</label>
            <div class="input-group">
              <input type="password" class="arena-input" id="signupPasswordConfirm" placeholder="Repeat your password" minlength="8" required>
              <button type="button" class="input-group-text bg-surface-2 border-subtle text-secondary password-toggle-btn" data-target="signupPasswordConfirm" aria-label="Toggle password confirm">
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>
          </div>

          <div class="form-check align-items-start">
            <input class="form-check-input" type="checkbox" id="termsAgreeCheck" required checked>
            <label class="form-check-label text-secondary small" for="termsAgreeCheck">
              I agree to the <a href="contact.html" class="text-primary text-decoration-none">Terms of Service</a> and confirm that I am 18 years or older.
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
            Create Account <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <!-- Social Registration at Bottom (Google & Apple) -->
        <div class="d-flex align-items-center my-4">
          <hr class="flex-grow-1 border-subtle">
          <span class="px-3 text-muted small text-uppercase">Or sign up with</span>
          <hr class="flex-grow-1 border-subtle">
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <button type="button" class="btn btn-outline-arena w-100 py-2 d-flex align-items-center justify-content-center gap-2" onclick="window.ArenaToast ? window.ArenaToast.show('Google account linked successfully.', 'success') : alert('Signed up');">
              <i class="bi bi-google fs-5" style="color: #EA4335;"></i>
              <span class="small fw-semibold">Google</span>
            </button>
          </div>
          <div class="col-6">
            <button type="button" class="btn btn-outline-arena w-100 py-2 d-flex align-items-center justify-content-center gap-2" onclick="window.ArenaToast ? window.ArenaToast.show('Apple ID linked successfully.', 'success') : alert('Signed up');">
              <i class="bi bi-apple fs-5 text-white"></i>
              <span class="small fw-semibold">Apple</span>
            </button>
          </div>
        </div>

        <div class="text-center mt-3 pt-3 border-top border-subtle text-secondary small">
          Already have an account? 
          <a href="login.html" class="text-primary fw-bold text-decoration-none">Sign In</a>
        </div>

      </div>

      <!-- Bottom Return Link -->
      <div class="text-center mt-4">
        <a href="index.html" class="text-muted small text-decoration-none">
          <i class="bi bi-arrow-left"></i> Return to ARENA Homepage
        </a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
